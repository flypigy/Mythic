name: Build Mythic
on:
  push:
    paths: &workflow_paths
      - '.github/workflows/build.yml'
      - 'Mythic.xcodeproj/**'
      - 'Mythic/**'
  pull_request:
    paths: *workflow_paths
  workflow_dispatch:

# cancel previous runs w/ same ref, save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v5

    # Pin Xcode to a version the project is known to compile cleanly with.
    # The runner's default (newer Xcode, e.g. 26.5) tightens Swift 6 strict-concurrency
    # checks and turns pre-existing `sending ... data races` cases into errors, failing
    # the build. 26.4.1 matches the upstream's last green build.
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.4.1'

    - uses: irgaly/xcode-cache@v1
      with:
        key: xcode-cache-deriveddata-${{ github.workflow }}-${{ github.sha }}
        restore-keys: xcode-cache-deriveddata-${{ github.workflow }}-

    - run: |
        xcodebuild -scheme Mythic \
          CODE_SIGNING_ALLOWED=NO \
          SWIFTLINT=NO \
          -parallel-testing-enabled YES \
          -jobs $(sysctl -n hw.ncpu) \
          -verbose
