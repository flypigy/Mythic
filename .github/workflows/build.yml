name: Build Mythic
on:
  push:
    paths: &workflow_paths
      - '.github/workflows/build.yml'
      - 'Mythic.xcodeproj/**'
      - 'Mythic/**'
  pull_request:
    paths: *workflow_paths
  workflow_dispatch:

# cancel previous runs w/ same ref, save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v5

    # Pin Xcode to a version the project is known to compile cleanly with.
    # The runner's default (newer Xcode, e.g. 26.5) tightens Swift 6 strict-concurrency
    # checks and turns pre-existing `sending ... data races` cases into errors, failing
    # the build. 26.4.1 matches the upstream's last green build.
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.4.1'

    - uses: irgaly/xcode-cache@v1
      with:
        key: xcode-cache-deriveddata-${{ github.workflow }}-${{ github.sha }}
        restore-keys: xcode-cache-deriveddata-${{ github.workflow }}-
        # Match the -derivedDataPath build passed to xcodebuild below, so the cache
        # actually finds (and saves) the DerivedData produced by the build.
        deriveddata-directory: build

    - name: Build
      run: |
        xcodebuild -scheme Mythic \
          -configuration Debug \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          SWIFTLINT=NO \
          -parallel-testing-enabled YES \
          -jobs $(sysctl -n hw.ncpu) \
          build

    - name: Ad-hoc sign and package .app
      run: |
        set -euo pipefail
        APP="build/Build/Products/Debug/Mythic.app"

        # Ad-hoc sign so the app launches locally without a developer certificate.
        # (First launch still needs a right-click → Open to bypass Gatekeeper.)
        codesign --force --deep --sign - "$APP"

        # Keep the bundled legendary CLI executable.
        chmod +x "$APP/Contents/Resources/legendary/cli" 2>/dev/null || true

        # Zip it up for download.
        cd build/Build/Products/Debug
        ditto -c -k --keepParent Mythic.app Mythic.app.zip

    - name: Upload .app artifact
      uses: actions/upload-artifact@v7
      with:
        name: Mythic-app
        path: build/Build/Products/Debug/Mythic.app.zip
        retention-days: 30
